name: Build TNT Event mod

on:
  push:
    paths:
      - 'tnt-event-mod/**'
      - '.github/workflows/build-tnt-event-mod.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tnt-event-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tnt-event-mod
          path: tnt-event-mod/build/libs/*.jar
